# Build the Android TV APK on GitHub's runners and hand back a download.
#
# The build cannot run in a plain sandbox (no JDK and no Android SDK), which is
# why the APK is produced *here* instead: a machine that has both, plus the
# Capacitor CLI that copies `desktop/ui` into the APK.
#
# Run it from Actions → "Android TV APK" → Run workflow, then download
# `autocat-collections-debug-apk` from the run's Artifacts section.
#
# The APK is **standalone**: it carries the catalog server itself (a Node project at
# `desktop/ui/nodejs`, built by `npm run android:node` and started on the device by the
# Capacitor Node.js runtime — see desktop/README.md). Nothing has to be running
# anywhere else, and `ui/config.js` falls back to `http://127.0.0.1:4173` in a packaged
# build. The optional `AUTOCAT_HOST` repository variable (Settings → Secrets and
# variables → Actions → Variables) only exists for pointing a build at a *remote*
# server instead, e.g. `https://your-addon-host.example.com`.
name: Android TV APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install the app's dependencies
        working-directory: desktop
        # Only the Capacitor CLI is needed here, so skip Electron's ~100MB binary
        # (its postinstall is allowed by `allowScripts` in desktop/package.json).
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Point the packaged app at a remote catalog server (optional)
        if: vars.AUTOCAT_HOST != ''
        working-directory: desktop
        run: |
          node -e '
            const fs = require("node:fs");
            const host = process.env.AUTOCAT_HOST;
            const file = "ui/config.js";
            const before = fs.readFileSync(file, "utf8");
            const after = before.replace(/window\.AUTOCAT_HOST = "";/, `window.AUTOCAT_HOST = "${host}";`);
            fs.writeFileSync(file, after);
            console.log(after.includes(host) ? `AUTOCAT_HOST set to ${host}` : "AUTOCAT_HOST was not applied");
          '
        env:
          AUTOCAT_HOST: ${{ vars.AUTOCAT_HOST }}

      - name: Build the in-APK node project and copy the UI into the Android project
        working-directory: desktop
        run: npm run android:sync

      - name: Build the debug APK
        working-directory: desktop/android
        run: sh ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: autocat-collections-debug-apk
          path: desktop/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
