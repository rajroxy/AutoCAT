// **The Capacitor 8 minimums** (Updating to 8.0): min SDK 24, compile/target 36, and the
// androidx versions that go with them. Capacitor 8 is what the APK's Node.js runtime needs
// (`@capawesome/capacitor-nodejs` declares `@capacitor/core >= 8.0.0`).
ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    // The playback engine's own library (Media3 / ExoPlayer).
    media3Version = '1.4.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}