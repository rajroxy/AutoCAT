<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuvio Collections</title>
<!-- The accent and the motion setting are put on the document **before the first
     paint**, from the last values the app resolved. The app itself re-applies them
     on boot, but it runs after the page has been drawn once — which is the flash of
     the default gold before your own accent arrives. -->
<script>
  try {
    var theme = JSON.parse(localStorage.getItem("nuvio.theme") || "null");
    if (theme) {
      var root = document.documentElement;
      if (theme.base) root.style.setProperty("--accent", theme.base);
      if (theme.rgb) root.style.setProperty("--accent-rgb", theme.rgb);
      if (theme.deep) root.style.setProperty("--accent-deep", theme.deep);
      // **No typeface here any more.** A stored `theme.font` from a build that offered the
      // setting is deliberately ignored: the app is set in one face (see `--font` in
      // style.css), so an old choice cannot leave someone on a face the app no longer has.
      if (theme.motion === "off") root.classList.add("motion-off");
      if (theme.motion === "full") root.classList.add("motion-full");
    }
  } catch (e) { /* no stored theme yet: the default is the right answer */ }
</script>
<!-- `?v=` is the cache-buster: bump it whenever style.css or app.js changes, or
     browsers keep showing the old UI long after the server has moved on. -->
<link rel="stylesheet" href="./style.css?v=20261011c">
</head>
<body>
  <!-- Boot screen. It covers the app until the first screen is drawn, then fades
       out — a real element rather than a timer, so the app never appears
       half-built behind a spinner that has already gone. -->
  <div class="boot" id="boot">
    <div class="boot-brand">
      <!-- **The wordmark and its line are one column.** The progress line belongs under
           the name, spanning exactly its width — not under the cat, and not across the
           whole screen. -->
      <span class="boot-name-col">
        <span class="boot-name">Auto</span>
        <!-- One line that fills from left to right, once, and stays full. Drawn rather
             than a percent figure: this screen waits on the first catalog read, and a
             number that had to be invented would be a lie. CSS-only, so `motion-off` /
             reduced-motion stop it like everything else here. -->
        <span class="boot-loader" role="progressbar" aria-label="Loading">
          <span class="boot-loader-bar" aria-hidden="true"></span>
        </span>
      </span>
      <!-- **The C, and it is the letter itself.** It fills the slot the app's drawn cat
           used to hold. That animal was a real drawing of a real cat curled around an arc,
           swapped in under a blur at the end of the opening — and a wordmark with a
           picture in the middle of it is not a wordmark. The letter is set in the same
           face, size and weight as the "Auto" beside it, so **AutoCAT** reads as one word
           that happens to be a pun, which is the whole joke. -->
      <span class="boot-mark" aria-hidden="true">C</span>
      <!-- **And then the last two letters: the A, and then the T.** They arrive one after
           the other — the A slides in from the left first, and the T lands beside it — so
           the name completes the way it is read. The line has just filled when the A
           starts. Ordinary text, so with motion off (or reduced motion) they are simply
           there. -->
      <span class="boot-letters" aria-hidden="true"><span class="boot-letter">A</span><span class="boot-letter">T</span></span>
    </div>
    <p class="boot-note">Preparing your collections…</p>
  </div>

  <header class="topbar">
    <button class="icon-btn focusable" id="back" title="Back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </button>
    <!-- **The rule that belongs to the arrow.** On the pages you arrive at *from* a
         title — a person's credits, a studio, a network, a genre, a season — the back
         arrow stands alone in an otherwise empty bar, so it wears the same accent rule
         the Home bar does. On Home that rule separates the controls from the nav; here
         it separates the way out from the page's own name. -->
    <span class="top-divider back-divider" id="back-divider" aria-hidden="true" hidden></span>

    <!-- No app logo or label: the profile icon takes the top-left slot, with the
         calendar to its right. The icon opens the switch-profile screen. -->
    <div class="top-left" id="top-left">
      <button class="icon-btn profile-btn focusable" id="profile" title="Switch mode" aria-label="Switch mode">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.6"></circle>
          <path d="M5 20.5c0-3.6 3.1-5.7 7-5.7s7 2.1 7 5.7"></path>
        </svg>
      </button>
      <button class="icon-btn focusable" id="calendar" title="Calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect>
          <path d="M3.5 10h17"></path>
          <path d="M8 3v4M16 3v4"></path>
        </svg>
      </button>
      <span class="top-divider" aria-hidden="true"></span>
    </div>

    <nav class="tabs" id="tabs" role="tablist"></nav>

    <div class="top-right">
      <button class="icon-btn focusable" id="search" title="Search" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.4"></circle>
          <path d="M15.9 15.9l4.6 4.6"></path>
        </svg>
      </button>
      <!-- A real cog: the old glyph was a centre dot with eight even spokes, which
           reads as a brightness/sun icon, not as settings. -->
      <button class="icon-btn focusable" id="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close focusable" data-close aria-label="Close">✕</button>
      <div class="modal-hero" id="modal-hero"></div>
      <div class="modal-body">
        <h2 id="modal-title"></h2>
        <p class="modal-meta" id="modal-meta"></p>
        <p class="modal-desc" id="modal-desc"></p>
        <div class="modal-actions">
          <!-- Plan to watch / watching / watched. Filled in when a title opens. -->
          <div class="modal-pins" id="modal-pins" role="group" aria-label="Watchlist"></div>
          <button class="btn primary focusable" id="modal-sources" type="button">Find sources</button>
        </div>
      </div>
    </article>
  </div>

  <script src="./config.js"></script>
  <script type="module" src="./app.js?v=20261011c"></script>
</body>
</html>
