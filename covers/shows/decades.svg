<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Decades — shows collection cover" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Decades — shows collection cover</title>
  <defs>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7DCE6"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0C10" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#0B0C10" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B0C10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelShade" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="rgba(6,7,10,0)"/>
      <stop offset="1" stop-color="rgba(6,7,10,0.42)"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.42" cy="0.5" r="0.85">
      <stop offset="0.55" stop-color="rgba(0,0,0,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.45)"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="970" y="60" width="890" height="960" rx="30"/>
    </clipPath>

    <linearGradient id="ivoryS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#9AA2B4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8A96A" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#C8A96A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C8A96A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3A3F4D"/><stop offset="0.6" stop-color="#C9CEDB"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="colG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4A5060" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E8ECF4"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C8A96A" stop-opacity="0.12"/>
    </radialGradient>
    <style>
      .glow { animation: glowPulse 11s ease-in-out infinite; }
      @keyframes glowPulse { 0%,100% { opacity: 0.68; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#08090C"/>

  <rect x="970" y="60" width="890" height="960" rx="30" fill="#0B0C10"/>
  <g clip-path="url(#cardClip)">
    <g transform="translate(2830 0) scale(-1 1)">
      <circle cx="1415" cy="540" r="595.2" fill="url(#glow)" class="glow"/>
    <circle cx="1415" cy="540" r="134.4" fill="none" stroke="url(#ivoryS)" stroke-width="2" opacity="0.75"/>
    <circle cx="1415" cy="540" r="220.8" fill="none" stroke="url(#ivoryS)" stroke-width="2" opacity="0.63"/>
    <circle cx="1415" cy="540" r="307.2" fill="none" stroke="url(#ivoryS)" stroke-width="2" opacity="0.51"/>
    <circle cx="1415" cy="540" r="384" fill="none" stroke="url(#ivoryS)" stroke-width="2.4" opacity="0.39"/>
    <line x1="1415" y1="194.4" x2="1415" y2="117.6" stroke="#C8A96A" stroke-width="4" opacity="0.85"/>
    <line x1="1760.6" y1="540" x2="1837.4" y2="540" stroke="#C8A96A" stroke-width="4" opacity="0.85"/>
    <line x1="1415" y1="885.6" x2="1415" y2="962.4" stroke="#C8A96A" stroke-width="4" opacity="0.85"/>
    <line x1="1069.4" y1="540" x2="992.6" y2="540" stroke="#C8A96A" stroke-width="4" opacity="0.85"/>
    <circle cx="1415" cy="540" r="6" fill="#E7EBF3"/>
    </g>
    <rect x="970" y="60" width="890" height="960" fill="url(#panelShade)"/>
    <rect x="970" y="60" width="373.8" height="960" fill="url(#feather)"/>
  </g>
  <rect x="970.75" y="60.75" width="888.5" height="958.5" rx="30" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#vignette)"/>

  <g>
    <text x="140" y="538.7" font-family="Inter" font-size="140" font-weight="800" letter-spacing="-4.90" fill="url(#titleFill)">Decades</text>
    <text x="140" y="647.9" font-family="Inter" font-size="32" font-weight="600" letter-spacing="6.40" fill="rgba(231,235,243,0.52)">2020s  ·  2010s  ·  2000s  ·  1990s</text>
    <text x="140" y="693.3" font-family="Inter" font-size="32" font-weight="600" letter-spacing="6.40" fill="rgba(231,235,243,0.52)">1980s  ·  1970s  ·  +2 more</text>
  </g>

  <rect x="0.75" y="0.75" width="1918.5" height="1078.5" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
</svg>
