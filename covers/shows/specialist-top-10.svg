    <path d="M 1415 540 L 1415 232.8 A 307.2 307.2 0 0 1 1632.2 322.8 Z" fill="rgba(200,169,106,0.2)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M 1415 540 L 1632.2 322.8 A 307.2 307.2 0 0 1 1722.2 540 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M 1415 540 L 1722.2 540 A 307.2 307.2 0 0 1 1632.2 757.2 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M 1415 540 L 1632.2 757.2 A 307.2 307.2 0 0 1 1415 847.2 Z" fill="rgba(200,169,106,0.2)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M 1415 540 L 1415 847.2 A 307.2 307.2 0 0 1 1197.8 757.2 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M 1415 540 L 1197.8 757.2 A 307.2 307.2 0 0 1 1107.8 540 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M 1415 540 L 1107.8 540 A 307.2 307.2 0 0 1 1197.8 322.8 Z" fill="rgba(200,169,106,0.2)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M 1415 540 L 1197.8 322.8 A 307.2 307.2 0 0 1 1415 232.8 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <circle cx="1415" cy="540" r="307.2" fill="none" stroke="url(#ivoryS)" stroke-width="2.4"/>
    <circle cx="1415" cy="540" r="7" fill="#C8A96A"/>
