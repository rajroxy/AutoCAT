<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Specialist | Top 10 — shows collection cover" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Specialist | Top 10 — shows collection cover</title>
  <defs>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7DCE6"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0C10" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#0B0C10" stop-opacity="0.55"/>
