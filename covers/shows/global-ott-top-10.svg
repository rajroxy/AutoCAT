<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="International | Top 10 — shows collection cover" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>International | Top 10 — shows collection cover</title>
  <defs>
