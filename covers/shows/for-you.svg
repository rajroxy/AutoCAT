  <rect x="970.75" y="60.75" width="888.5" height="958.5" rx="30" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#vignette)"/>

  <g>
    <text x="140" y="496.6" font-family="Inter" font-size="129" font-weight="800" letter-spacing="-4.52" fill="url(#titleFill)">For</text>
    <text x="140" y="620.5" font-family="Inter" font-size="129" font-weight="800" letter-spacing="-4.52" fill="url(#titleFill)">You</text>
    <text x="140" y="727" font-family="Inter" font-size="32" font-weight="600" letter-spacing="6.40" fill="rgba(231,235,243,0.52)">More Like What You Watch</text>
