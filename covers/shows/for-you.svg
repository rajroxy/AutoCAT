    <rect x="1272.6" y="252" width="445" height="307.2" rx="14" fill="#0F1116" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
      
      <path d="M 1680.9 264 h 22.7 v 23.8 l -11.3 -7.7 l -11.3 7.7 Z" fill="rgba(255,255,255,0.5)"/>
    <rect x="1228.1" y="328.8" width="445" height="307.2" rx="14" fill="#0F1116" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
      
      <path d="M 1636.4 340.8 h 22.7 v 23.8 l -11.3 -7.7 l -11.3 7.7 Z" fill="rgba(255,255,255,0.5)"/>
    <rect x="1183.6" y="405.6" width="445" height="307.2" rx="14" fill="#15171E" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
      <circle cx="1272.6" cy="559.2" r="43.2" fill="none" stroke="#C8A96A" stroke-width="2.4"/>
      <path d="M 1257.2 559.2 l 13.4 15.4 l 25 -30.7" fill="none" stroke="#C8A96A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="1326" y1="528.5" x2="1530.7" y2="528.5" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
      <line x1="1326" y1="596.1" x2="1459.5" y2="596.1" stroke="rgba(255,255,255,0.28)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 1591.9 417.6 h 22.7 v 23.8 l -11.3 -7.7 l -11.3 7.7 Z" fill="#C8A96A"/>
