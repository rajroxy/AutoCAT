  <rect x="970.75" y="60.75" width="888.5" height="958.5" rx="30" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#vignette)"/>

  <g>
    <text x="140" y="451.2" font-family="Inter" font-size="129" font-weight="800" letter-spacing="-4.52" fill="url(#titleFill)">Top Rated</text>
    <text x="140" y="575" font-family="Inter" font-size="129" font-weight="800" letter-spacing="-4.52" fill="url(#titleFill)">◆ Genre</text>
    <text x="140" y="681.6" font-family="Inter" font-size="32" font-weight="600" letter-spacing="6.40" fill="rgba(231,235,243,0.52)">Top Rated in Action</text>
    <text x="140" y="727" font-family="Inter" font-size="32" font-weight="600" letter-spacing="6.40" fill="rgba(231,235,243,0.52)">Top Rated in Adventure</text>
    <text x="140" y="772.5" font-family="Inter" font-size="32" font-weight="600" letter-spacing="6.40" fill="rgba(231,235,243,0.52)">+16 more</text>
