    <rect x="1088.7" y="367.2" width="35.5" height="403.2" rx="17.7" fill="url(#colG)"/>
    <rect x="1165.9" y="156" width="35.5" height="614.4" rx="17.7" fill="url(#colG)"/>
    <rect x="1243" y="444" width="35.5" height="326.4" rx="17.7" fill="url(#colG)"/>
    <rect x="1320.1" y="2.4" width="35.5" height="768" rx="17.7" fill="url(#colG)"/>
    <rect x="1397.3" y="271.2" width="35.5" height="499.2" rx="17.7" fill="url(#colG)"/>
    <rect x="1474.4" y="-112.8" width="35.5" height="883.2" rx="17.7" fill="url(#colG)"/>
    <rect x="1551.5" y="328.8" width="35.5" height="441.6" rx="17.7" fill="url(#colG)"/>
    <rect x="1628.7" y="98.4" width="35.5" height="672" rx="17.7" fill="url(#colG)"/>
    <rect x="1705.8" y="482.4" width="35.5" height="288" rx="17.7" fill="url(#colG)"/>
    <line x1="1044.8" y1="770.4" x2="1769.8" y2="770.4" stroke="url(#ivoryS)" stroke-width="2" opacity="0.5"/>
