  <g clip-path="url(#cardClip)">
    <g>
      <circle cx="1415" cy="693.6" r="576" fill="url(#glow)" class="glow"/>
    <path d="M 1280.6 789.6 A 134.4 134.4 0 0 1 1549.4 789.6" fill="none" stroke="url(#ivoryS)" stroke-width="2.4" opacity="0.85"/>
    <path d="M 1184.6 789.6 A 230.4 230.4 0 0 1 1645.4 789.6" fill="none" stroke="url(#ivoryS)" stroke-width="2.4" opacity="0.69"/>
    <path d="M 1088.6 789.6 A 326.4 326.4 0 0 1 1741.4 789.6" fill="none" stroke="url(#ivoryS)" stroke-width="2.4" opacity="0.53"/>
    <path d="M 992.6 789.6 A 422.4 422.4 0 0 1 1837.4 789.6" fill="none" stroke="url(#ivoryS)" stroke-width="2.4" opacity="0.37"/>
    <line x1="1415" y1="789.6" x2="1415" y2="636" stroke="url(#ivoryS)" stroke-width="3"/>
    <circle cx="1415" cy="616.8" r="8" fill="#C8A96A"/>
    <line x1="1076.8" y1="789.6" x2="1753.2" y2="789.6" stroke="url(#ivoryS)" stroke-width="2" opacity="0.45"/>
